<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="pageTitle">Loading…</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="nav">
      <div class="container nav-inner">
        <div class="brand">
          <img id="logo" class="logo" alt="Logo" />
          <span id="businessName">Business Name</span>
        </div>
        <a class="nav-cta" id="ctaTop" href="#">Call now</a>
      </div>
    </header>

    <main>
  <!-- HERO -->
  <section id="hero" class="hero">
    <div class="container hero-inner">
      <div class="hero-grid">

        <div class="hero-copy">
          <h1 id="headline">Headline</h1>
          <p id="subheadline">Subheadline</p>

          <div class="hero-actions">
            <a class="btn" id="cta" href="#">Call now</a>
            <a class="btn btn-ghost" href="#contact">Get details</a>
          </div>

          <p class="micro">Fast, simple demo site. Content loads from JSON.</p>
        </div>

        <div class="hero-media">
          <img id="heroImage" class="hero-image" alt="Hero image" />
        </div>

      </div>
    </div>
  </section>

      <!-- SERVICES -->
      <section class="section">
        <div class="container">
          <h2>Services</h2>
          <div class="grid" id="services"></div>
        </div>
      </section>

      <!-- TESTIMONIALS -->
      <section class="section section-muted">
        <div class="container">
          <h2>What customers say</h2>
          <div class="grid" id="testimonials"></div>
        </div>
      </section>

      <!-- FAQ -->
      <section class="section">
        <div class="container">
          <h2>FAQ</h2>
          <div class="faq" id="faqs"></div>
        </div>
      </section>

      <!-- CONTACT -->
      <section class="section section-muted" id="contact">
        <div class="container">
          <h2>Contact</h2>
          <div class="contact">
            <div class="contact-card">
              <div class="label">Phone</div>
              <a id="phoneLink" href="#"><span id="phoneText"></span></a>
            </div>
            <div class="contact-card">
              <div class="label">Email</div>
              <a id="emailLink" href="#"><span id="emailText"></span></a>
            </div>
            <div class="contact-card">
              <div class="label">Address</div>
              <div id="addressText"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>© <span id="footerName">Business Name</span></div>
        <div class="muted">Template v<span id="tplVer">?</span></div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
